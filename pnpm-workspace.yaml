packages:
  - "apps/*"
  - "packages/*"

# CI (Cloudflare) fails install if unreviewed lifecycle scripts are treated as errors.
strictDepBuilds: false

allowBuilds:
  esbuild: true
  msw: false
  "@parcel/watcher": true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - hono@4.13.9
