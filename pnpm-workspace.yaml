packages:
  - "apps/*"
  - "packages/*"

# Cloudflare Workers Builds (pnpm 12): unreviewed lifecycle scripts must not fail CI.
strictDepBuilds: false
dangerouslyAllowAllBuilds: true

allowBuilds:
  esbuild: true
  msw: false
  "@parcel/watcher": true
  unrs-resolver: true
  workerd: true
  sharp: true

minimumReleaseAgeExclude:
  - hono@4.13.9
